name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/managed_components
          key: pio-${{ hashFiles('firmware/platformio.ini', 'firmware/dependencies.lock', 'firmware/sdkconfig.defaults') }}
      - run: pip install platformio==6.1.18
      - name: Firmware signing key
        env:
          KEY: ${{ secrets.FIRMWARE_SIGNING_KEY_B64 }}
        run: mkdir -p firmware/signing && echo "$KEY" | base64 -d > firmware/signing/firmware-signing.pem
      - run: pio run
        working-directory: firmware
      - run: |
          mkdir -p out
          version=$(sed -n 's/.*set(PROJECT_VER "\(.*\)").*/\1/p' firmware/CMakeLists.txt)
          cp firmware/.pio/build/sticky/firmware.bin "out/resticky-firmware-$version.bin"
          cp firmware/.pio/build/sticky/bootloader.bin out/resticky-bootloader.bin
          cp firmware/.pio/build/sticky/partitions.bin out/resticky-partitions.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/*

  hubs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null
          "$sdk" --install "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        if: env.KEYSTORE != ''
        run: mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - run: ./gradlew :shared:jvmTest :desktopApp:installDist :androidApp:assembleDebug :androidApp:assembleRelease
        working-directory: app
      - run: app/contract/run.sh app/desktopApp/build/install/resticky-hub/bin/resticky-hub
      - run: |
          mkdir -p out
          cp app/androidApp/build/outputs/apk/release/*.apk out/resticky-android.apk
          cp app/androidApp/build/outputs/apk/debug/*.apk out/resticky-android-debug.apk
          (cd app/desktopApp/build/install && zip -qr ../../../../out/resticky-hub-desktop.zip resticky-hub)
      - uses: actions/upload-artifact@v4
        with:
          name: hubs
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, hubs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
